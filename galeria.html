<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Escolar</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f7f6;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 40px;
}

.item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    cursor: pointer;
}

/* LIGHTBOX */
.lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.lightbox img {
    max-width: 90%;
    max-height: 80%;
}

button {
    margin: 10px;
    padding: 10px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="gallery-grid">

<div class="item" onclick="openGallery(0)">
        <img src="imagenuno.jpeg">
        <div class="caption">Gael Gonzalez</div>
    </div>

    </div>

</div>

<div class="lightbox" id="lightbox">
    <img id="img">
    <div>
        <button onclick="prev()">⬅</button>
        <button onclick="next()">➡</button>
        <button onclick="closeBox()">Cerrar</button>
    </div>
</div>

<script>

const images = [
   ["imagenuno.jpeg"], 
    ["imagendos.jpeg"],         
    ["imagentres.jpeg"], 
    ["imagencuatro.jpeg"],
    ["imagencinco.jpeg"],
    ["imagenseis.jpeg"],
    ["imagensiete.jpeg"],  
    ["imagenocho.jpeg"], 
    ["imagennueve.jpeg"],         
    ["imagendiez.jpeg"], 
    ["imagenonce.jpeg"],
    ["imagendoce.jpeg"],
    ["imagentrece.jpeg"],
    ["imagencatorce.jpeg"], 
    ["imagenquince.jpeg"],
    ["imagendieciseis.jpeg"],
    ["imagendiecisiete.jpeg"], 
];

let index = 0;

function openImage(i){
    index = i;
    document.getElementById("lightbox").style.display = "flex";
    show();
}

function show(){
    console.log("Mostrando:", images[index]); // 👈 DEBUG
    document.getElementById("img").src = images[index];
}

function next(){
    index++;
    if(index >= images.length){
        index = 0; // 🔁 vuelve al inicio
    }
    show();
}

function prev(){
    index--;
    if(index < 0){
        index = images.length - 1; // 🔁 vuelve al final
    }
    show();
}

function closeBox(){
    document.getElementById("lightbox").style.display = "none";
}

// 👉 TAMBIÉN FUNCIONA CON TECLADO
document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight") next();
    if(e.key === "ArrowLeft") prev();
    if(e.key === "Escape") closeBox();
});

</script>
