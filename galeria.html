<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Escolar</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f7f6;
}

.header {
    background: #A6192E;
    color: white;
    text-align: center;
    padding: 20px;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #A6192E;
    color: white;
    padding: 10px 15px;
    border-radius: 30px;
    text-decoration: none;
}

.title {
    text-align: center;
    font-size: 40px;
    color: #A6192E;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 40px;
}

.item {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
}

.item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* LIGHTBOX */
.lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.lightbox img {
    max-width: 80%;
    max-height: 80%;
}

.controls {
    margin-top: 20px;
}

button {
    padding: 10px;
    margin: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<a href="index.html" class="back-button">⬅ Regresar</a>

<div class="header">
    <h1>GALERÍA ESCOLAR</h1>
</div>

<h2 class="title">Alumnos</h2>

<div class="gallery-grid">

<div class="item" onclick="openImage(0)"><img src="imagenuno.jpeg"></div>
<div class="item" onclick="openImage(1)"><img src="imagendos.jpeg"></div>
<div class="item" onclick="openImage(2)"><img src="imagentres.jpeg"></div>
<div class="item" onclick="openImage(3)"><img src="imagencuatro.jpeg"></div>
<div class="item" onclick="openImage(4)"><img src="imagencinco.jpeg"></div>
<div class="item" onclick="openImage(5)"><img src="imagenseis.jpeg"></div>
<div class="item" onclick="openImage(6)"><img src="imagensiete.jpeg"></div>
<div class="item" onclick="openImage(7)"><img src="imagenocho.jpeg"></div>
<div class="item" onclick="openImage(8)"><img src="imagennueve.jpeg"></div>
<div class="item" onclick="openImage(9)"><img src="imagendiez.jpeg"></div>
<div class="item" onclick="openImage(10)"><img src="imagenonce.jpeg"></div>
<div class="item" onclick="openImage(11)"><img src="imagendoce.jpeg"></div>
<div class="item" onclick="openImage(12)"><img src="imagentrece.jpeg"></div>
<div class="item" onclick="openImage(13)"><img src="imagencatorce.jpeg"></div>
<div class="item" onclick="openImage(14)"><img src="imagenquince.jpeg"></div>
<div class="item" onclick="openImage(15)"><img src="imagendieciseis.jpeg"></div>
<div class="item" onclick="openImage(16)"><img src="imagendiecisiete.jpeg"></div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
    <div class="controls">
        <button onclick="prevImage()">⬅</button>
        <button onclick="nextImage()">➡</button>
        <button onclick="closeLightbox()">Cerrar</button>
    </div>
</div>

<script>

// 🔥 TODAS TUS IMÁGENES (LAS MISMAS)
const images = [
"imagenuno.jpeg",
"imagendos.jpeg",
"imagentres.jpeg",
"imagencuatro.jpeg",
"imagencinco.jpeg",
"imagenseis.jpeg",
"imagensiete.jpeg",
"imagenocho.jpeg",
"imagennueve.jpeg",
"imagendiez.jpeg",
"imagenonce.jpeg",
"imagendoce.jpeg",
"imagentrece.jpeg",
"imagencatorce.jpeg",
"imagenquince.jpeg",
"imagendieciseis.jpeg",
"imagendiecisiete.jpeg"
];

let currentIndex = 0;

function openImage(index){
    currentIndex = index;
    document.getElementById("lightbox").style.display = "flex";
    showImage();
}

function showImage(){
    document.getElementById("lightbox-img").src = images[currentIndex];
}

function nextImage(){
    currentIndex = (currentIndex + 1) % images.length;
    showImage();
}

function prevImage(){
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage();
}

function closeLightbox(){
    document.getElementById("lightbox").style.display = "none";
}

</script>

</body>
</html>
