<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Escolar</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f7f6;
}

.header {
    background: #A6192E;
    color: white;
    text-align: center;
    padding: 20px;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #A6192E;
    color: white;
    padding: 10px 15px;
    border-radius: 30px;
    text-decoration: none;
}

.title {
    text-align: center;
    font-size: 40px;
    color: #A6192E;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 40px;
}

.item {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
}

.item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* LIGHTBOX */
.lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.lightbox img {
    max-width: 80%;
    max-height: 80%;
}

.controls {
    margin-top: 20px;
}

button {
    padding: 10px;
    margin: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<a href="index.html" class="back-button">⬅ Regresar</a>

<div class="header">
    <h1>GALERÍA ESCOLAR</h1>
</div>

<h2 class="title">Alumnos</h2>

<div class="gallery-grid">

<div class="item" onclick="openGallery(0)">
<img src="imagenuno.jpeg">
</div>

<div class="item" onclick="openGallery(1)">
<img src="imagendos.jpeg">
</div>

<div class="item" onclick="openGallery(2)">
<img src="imagentres.jpeg">
</div>

<div class="item" onclick="openGallery(3)">
<img src="imagencuatro.jpeg">
</div>

<div class="item" onclick="openGallery(4)">
<img src="imagencinco.jpeg">
</div>

<div class="item" onclick="openGallery(5)">
<img src="imagenseis.jpeg">
</div>

<div class="item" onclick="openGallery(6)">
<img src="imagensiete.jpeg">
</div>

<div class="item" onclick="openGallery(7)">
<img src="imagenocho.jpeg">
</div>

<div class="item" onclick="openGallery(8)">
<img src="imagennueve.jpeg">
</div>

<div class="item" onclick="openGallery(9)">
<img src="imagendiez.jpeg">
</div>

<div class="item" onclick="openGallery(10)">
<img src="imagenonce.jpeg">
</div>

<div class="item" onclick="openGallery(11)">
<img src="imagendoce.jpeg">
</div>

<div class="item" onclick="openGallery(12)">
<img src="imagentrece.jpeg">
</div>

<div class="item" onclick="openGallery(13)">
<img src="imagencatorce.jpeg">
</div>

<div class="item" onclick="openGallery(14)">
<img src="imagenquince.jpeg">
</div>

<div class="item" onclick="openGallery(15)">
<img src="imagendieciseis.jpeg">
</div>

<div class="item" onclick="openGallery(16)">
<img src="imagendiecisiete.jpeg">
</div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
    <div class="controls">
        <button onclick="prevImage()">⬅</button>
        <button onclick="nextImage()">➡</button>
        <button onclick="closeLightbox()">Cerrar</button>
    </div>
</div>

<script>

// 🔥 AHORA CADA ALUMNO TIENE VARIAS IMÁGENES
const galleries = [
["imagenuno.jpeg","imagenuno2.jpeg","imagenuno3.jpeg"],
["imagendos.jpeg","imagendos2.jpeg"],
["imagentres.jpeg","imagentres2.jpeg"],
["imagencuatro.jpeg","imagencuatro2.jpeg"],
["imagencinco.jpeg","imagencinco2.jpeg"],
["imagenseis.jpeg","imagenseis2.jpeg"],
["imagensiete.jpeg","imagensiete2.jpeg"],
["imagenocho.jpeg","imagenocho2.jpeg"],
["imagennueve.jpeg","imagennueve2.jpeg"],
["imagendiez.jpeg","imagendiez2.jpeg"],
["imagenonce.jpeg","imagenonce2.jpeg"],
["imagendoce.jpeg","imagendoce2.jpeg"],
["imagentrece.jpeg","imagentrece2.jpeg"],
["imagencatorce.jpeg","imagencatorce2.jpeg"],
["imagenquince.jpeg","imagenquince2.jpeg"],
["imagendieciseis.jpeg","imagendieciseis2.jpeg"],
["imagendiecisiete.jpeg","imagendiecisiete2.jpeg"]
];

let currentGallery = [];
let currentIndex = 0;

function openGallery(index){
    currentGallery = galleries[index];
    currentIndex = 0;
    document.getElementById("lightbox").style.display = "flex";
    showImage();
}

function showImage(){
    document.getElementById("lightbox-img").src = currentGallery[currentIndex];
}

function nextImage(){
    currentIndex = (currentIndex + 1) % currentGallery.length;
    showImage();
}

function prevImage(){
    currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    showImage();
}

function closeLightbox(){
    document.getElementById("lightbox").style.display = "none";
}

</script>

</body>
</html>
